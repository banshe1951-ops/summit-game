<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Вершина 🏔️</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }

  #app { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  canvas { display: block; image-rendering: pixelated; touch-action: none; }

  /* ── Экран старта ── */
  #screen-start {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #1a0a3e 0%, #0d1b4b 40%, #0a2a1a 100%);
    z-index: 10;
  }
  .stars-bg {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  }
  .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 2s infinite alternate; }
  @keyframes twinkle { from { opacity: 0.2; transform: scale(1); } to { opacity: 1; transform: scale(1.4); } }

  .mountain-silhouette {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 45%;
  }

  .logo-wrap {
    position: relative; z-index: 2; text-align: center; margin-bottom: 12px;
  }
  .logo-emoji { font-size: 72px; display: block; margin-bottom: 0; filter: drop-shadow(0 0 20px rgba(255,200,50,0.6)); animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .logo-title {
    font-family: 'Arial Rounded MT Bold', 'Nunito', Arial, sans-serif;
    font-size: 42px; font-weight: 900;
    background: linear-gradient(135deg, #FFD700, #FF8C00, #FF4500);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(255,140,0,0.5));
    letter-spacing: 2px;
  }
  .logo-sub {
    font-family: Arial, sans-serif; font-size: 14px;
    color: rgba(255,255,255,0.6); letter-spacing: 4px; text-transform: uppercase;
    margin-top: 4px;
  }

  .best-score {
    position: relative; z-index: 2;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 8px 24px;
    font-family: Arial, sans-serif; font-size: 14px; color: rgba(255,255,255,0.8);
    margin-bottom: 32px;
  }
  .best-score span { color: #FFD700; font-weight: 700; font-size: 16px; }

  .btn-play {
    position: relative; z-index: 2;
    background: linear-gradient(135deg, #FF6B35, #FF3CAC);
    border: none; border-radius: 50px;
    padding: 18px 64px; font-size: 22px; font-weight: 900;
    color: #fff; letter-spacing: 2px;
    cursor: pointer; font-family: Arial, sans-serif;
    box-shadow: 0 8px 32px rgba(255,60,172,0.5), 0 0 0 0 rgba(255,60,172,0.4);
    animation: pulse-btn 2s infinite;
    transition: transform 0.1s;
  }
  .btn-play:active { transform: scale(0.95); }
  @keyframes pulse-btn {
    0%,100% { box-shadow: 0 8px 32px rgba(255,60,172,0.5), 0 0 0 0 rgba(255,60,172,0.4); }
    50% { box-shadow: 0 8px 32px rgba(255,60,172,0.7), 0 0 0 12px rgba(255,60,172,0); }
  }

  .start-tips {
    position: relative; z-index: 2;
    display: flex; gap: 20px; margin-top: 28px;
  }
  .tip {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: Arial, sans-serif; font-size: 11px; color: rgba(255,255,255,0.5);
  }
  .tip-icon { font-size: 22px; }

  /* ── HUD во время игры ── */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: none; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    z-index: 5; pointer-events: none;
  }
  #hud.visible { display: flex; }

  .hud-score {
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    font-size: 26px; font-weight: 900; color: #FFD700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .hud-floor {
    font-family: Arial, sans-serif; font-size: 13px;
    color: rgba(255,255,255,0.7); text-align: center;
  }
  .hud-floor span { color: #7DF9FF; font-weight: 700; }

  .hud-lives { display: flex; gap: 4px; }
  .life { font-size: 20px; }

  /* ── Экран Game Over ── */
  #screen-gameover {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5, 0, 20, 0.92);
    z-index: 10; backdrop-filter: blur(4px);
  }
  #screen-gameover.visible { display: flex; }

  .go-title {
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    font-size: 52px; font-weight: 900; color: #FF4444;
    text-shadow: 0 0 30px rgba(255,68,68,0.6);
    margin-bottom: 8px; animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
  }

  .go-stats {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 20px 40px;
    margin: 20px 0; text-align: center;
    font-family: Arial, sans-serif;
  }
  .go-stat-row { display: flex; justify-content: space-between; gap: 40px; margin: 6px 0; }
  .go-stat-label { font-size: 13px; color: rgba(255,255,255,0.5); }
  .go-stat-value { font-size: 16px; font-weight: 700; color: #fff; }
  .go-stat-value.gold { color: #FFD700; }
  .go-stat-value.new { color: #00FF88; }

  .go-new-record {
    font-family: Arial, sans-serif; font-size: 18px; color: #00FF88;
    font-weight: 700; margin-bottom: 12px;
    animation: glow 1s ease-in-out infinite alternate;
  }
  @keyframes glow { from { text-shadow: 0 0 5px #00FF88; } to { text-shadow: 0 0 20px #00FF88, 0 0 40px #00FF88; } }

  .go-buttons { display: flex; flex-direction: column; gap: 12px; width: 220px; }

  .btn-restart {
    background: linear-gradient(135deg, #00C9FF, #92FE9D);
    border: none; border-radius: 40px; padding: 16px;
    font-size: 18px; font-weight: 900; color: #0a0a1a;
    cursor: pointer; font-family: Arial, sans-serif;
    transition: transform 0.1s;
  }
  .btn-restart:active { transform: scale(0.95); }

  .btn-menu {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 40px; padding: 14px;
    font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.8);
    cursor: pointer; font-family: Arial, sans-serif;
    transition: transform 0.1s;
  }
  .btn-menu:active { transform: scale(0.95); }

  /* ── Джойстик-оверлей (мобилка) ── */
  #ctrl-zone {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 35%; z-index: 4;
    -webkit-user-select: none; user-select: none;
  }

  #joystick-base {
    position: absolute;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
  }
  #joystick-knob {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 2px solid rgba(255,255,255,0.6);
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
    box-shadow: 0 0 12px rgba(255,255,255,0.3);
  }

  .ctrl-hint {
    position: absolute; bottom: 20px;
    font-family: Arial, sans-serif; font-size: 32px;
    opacity: 0.18; pointer-events: none; user-select: none;
  }
  #hint-left { left: 24px; }
  #hint-right { right: 24px; }
</style>
</head>
<body>
<div id="app">

  <!-- ══ СТАРТ ══ -->
  <div id="screen-start">
    <div class="stars-bg" id="stars-bg"></div>

    <svg class="mountain-silhouette" viewBox="0 0 400 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="0,200 80,80 160,130 200,40 240,100 320,60 400,130 400,200" fill="#0d1040" opacity="0.9"/>
      <polygon points="0,200 60,110 120,150 200,60 280,120 360,80 400,140 400,200" fill="#0a0d35" opacity="0.7"/>
      <circle cx="200" cy="58" r="5" fill="#FFD700" opacity="0.9"/>
      <circle cx="200" cy="58" r="10" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.4"/>
    </svg>

    <div class="logo-wrap">
      <span class="logo-emoji">🏔️</span>
      <div class="logo-title">ВЕРШИНА</div>
      <div class="logo-sub">Бесконечный платформер</div>
    </div>

    <div class="best-score" id="start-best">Рекорд: <span id="best-display">0</span> 🏅</div>

    <button class="btn-play" id="btn-play">▶ ИГРАТЬ</button>

    <div class="start-tips">
      <div class="tip"><span class="tip-icon">👆</span><span>Тап влево/<br>вправо</span></div>
      <div class="tip"><span class="tip-icon">🌟</span><span>Собирай<br>звёзды</span></div>
      <div class="tip"><span class="tip-icon">💎</span><span>Зарабатывай<br>TON</span></div>
    </div>
  </div>

  <!-- ══ HUD ══ -->
  <div id="hud">
    <div class="hud-score" id="hud-score">0</div>
    <div class="hud-floor">Этаж <span id="hud-floor">1</span></div>
    <div class="hud-lives" id="hud-lives"></div>
  </div>

  <!-- ══ КАНВАС ══ -->
  <canvas id="game-canvas"></canvas>

  <!-- ══ УПРАВЛЕНИЕ (джойстик) ══ -->
  <div id="ctrl-zone"></div>
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>
  <div class="ctrl-hint" id="hint-left">◀</div>
  <div class="ctrl-hint" id="hint-right">▶</div>

  <!-- ══ GAME OVER ══ -->
  <div id="screen-gameover">
    <div class="go-title">💀 УПАЛ!</div>
    <div class="go-new-record" id="go-new-record" style="display:none">🏆 НОВЫЙ РЕКОРД!</div>
    <div class="go-stats">
      <div class="go-stat-row">
        <span class="go-stat-label">Очки</span>
        <span class="go-stat-value gold" id="go-score">0</span>
      </div>
      <div class="go-stat-row">
        <span class="go-stat-label">Этаж</span>
        <span class="go-stat-value" id="go-floor">1</span>
      </div>
      <div class="go-stat-row">
        <span class="go-stat-label">Рекорд</span>
        <span class="go-stat-value" id="go-best">0</span>
      </div>
    </div>
    <div class="go-buttons">
      <button class="btn-restart" id="btn-restart">🔄 Снова</button>
      <button class="btn-menu" id="btn-menu">🏠 Меню</button>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════
// TELEGRAM INIT
// ══════════════════════════════════════════════════════
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.enableClosingConfirmation();
}

const userId = tg?.initDataUnsafe?.user?.id || 0;
const userName = tg?.initDataUnsafe?.user?.first_name || 'Игрок';

// Хранилище (localStorage как замена серверу для демо)
let bestScore = parseInt(localStorage.getItem(`summit_best_${userId}`) || '0');
let totalCoins = parseInt(localStorage.getItem(`summit_coins_${userId}`) || '0');
document.getElementById('best-display').textContent = bestScore;

// ══════════════════════════════════════════════════════
// ЗВЁЗДЫ НА СТАРТЕ
// ══════════════════════════════════════════════════════
(function() {
  const bg = document.getElementById('stars-bg');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s`;
    bg.appendChild(s);
  }
})();

// ══════════════════════════════════════════════════════
// CANVAS SETUP
// ══════════════════════════════════════════════════════
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); });

// ══════════════════════════════════════════════════════
// КОНСТАНТЫ ИГРЫ
// ══════════════════════════════════════════════════════
const GRAVITY       = 0.45;
const JUMP_FORCE    = -13;
const PLAYER_SPEED  = 5.5;
const PLATFORM_W_BASE = 80;
const PLATFORM_GAP  = 90;   // вертикальный шаг между платформами

// Максимальная высота прыжка и горизонтальное расстояние при dt=1
// jumpHeight = v²/(2g) = 13²/(2*0.45) ≈ 188px
// jumpTime   = 2*v/g  = 2*13/0.45  ≈ 57 frames
// maxHorizDist = speed * jumpTime  = 5.5 * 57 ≈ 315px
const MAX_JUMP_HEIGHT = 170;  // с запасом
const MAX_HORIZ_DIST  = 280;  // с запасом

// ══════════════════════════════════════════════════════
// СОСТОЯНИЕ ИГРЫ
// ══════════════════════════════════════════════════════
let gameState = 'start'; // start / playing / gameover
let score = 0;
let floor = 1;
let lives = 3;
let cameraY = 0;        // смещение камеры (растёт вверх)
let highestY = 0;       // самая высокая точка игрока

let player, platforms, stars, particles;
let keys = { left: false, right: false };

// ══════════════════════════════════════════════════════
// INIT GAME
// ══════════════════════════════════════════════════════
function initGame() {
  score = 0; floor = 1; lives = 3; cameraY = 0; highestY = 0;
  particles = [];

  // Платформы
  platforms = [];

  // Земля — широкая платформа на весь экран снизу
  platforms.push({ x: 0, y: H - 40, w: W, type: 'ground', bounce: false, crumbling: false, crumbleTimer: 0 });

  // Игрок стоит на земле
  player = {
    x: W / 2 - 20, y: H - 40 - 48,
    w: 40, h: 48,
    vx: 0, vy: 0,
    onGround: true,
    frame: 0, frameTimer: 0,
    facing: 1,
    trail: [],
  };

  // Первые несколько платформ близко, чтобы легко запрыгнуть
  let py = H - 40;
  let lastPlat = platforms[0]; // земля
  for (let i = 0; i < 5; i++) {
    py -= 75 + i * 8;
    const pw = 110 - i * 6;
    const prevCx = lastPlat.x + lastPlat.w / 2;
    const dx = (Math.random() * 2 - 1) * 80;
    const newCx = Math.max(pw/2+20, Math.min(W-pw/2-20, prevCx + dx));
    const plat = { x: newCx - pw/2, y: py, w: pw, type: 'normal', bounce: false, crumbling: false, crumbleTimer: 0 };
    platforms.push(plat);
    lastPlat = plat;
  }
  // Дальше обычная генерация
  for (let i = 0; i < 25; i++) {
    py -= PLATFORM_GAP + Math.random() * 20;
    lastPlat = spawnPlatform(py, lastPlat);
  }

  // Звёзды
  stars = [];
  for (let i = 0; i < 5; i++) spawnStar();

  updateHUD();
  showHUD(true);
}

function spawnPlatform(py, prevPlatform) {
  const diff = Math.min(floor / 25, 1); // 0..1 сложность
  const pw = Math.max(50, PLATFORM_W_BASE + 40 - diff * 30);

  let px;
  if (prevPlatform) {
    // Центр предыдущей платформы
    const prevCx = prevPlatform.x + prevPlatform.w / 2;
    const dy = Math.abs(py - prevPlatform.y); // вертикальный gap

    // Горизонтальное расстояние допустимо пропорционально высоте прыжка
    const horizFactor = Math.max(0, 1 - dy / MAX_JUMP_HEIGHT);
    const maxDx = MAX_HORIZ_DIST * horizFactor;

    // Случайное смещение центра новой платформы от предыдущей
    const dx = (Math.random() * 2 - 1) * maxDx;
    const newCx = Math.max(pw / 2 + 20, Math.min(W - pw / 2 - 20, prevCx + dx));
    px = newCx - pw / 2;
  } else {
    px = 20 + Math.random() * (W - pw - 40);
  }

  const types = ['normal','normal','normal','bounce','crumble'];
  const typeIdx = Math.floor(Math.random() * (2 + Math.floor(diff * 3)));
  const plat = {
    x: px, y: py, w: pw,
    type: types[Math.min(typeIdx, types.length - 1)],
    bounce: false,
    crumbling: false, crumbleTimer: 0,
    spring: false,
  };
  platforms.push(plat);
  return plat;
}

function spawnStar() {
  const minY = cameraY - H * 4;
  const maxY = cameraY - 80;
  stars.push({
    x: 30 + Math.random() * (W - 60),
    y: maxY - Math.random() * (H * 3),
    r: 8 + Math.random() * 6,
    collected: false,
    angle: Math.random() * Math.PI * 2,
    value: Math.floor(Math.random() * 3 + 1) * 10,
  });
}

// ══════════════════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════════════════
let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 16.67, 3);
  lastTime = ts;
  if (gameState === 'playing') update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════
function update(dt) {
  // Движение
  if (joystickActive) {
    const dx = joystickCurX - joystickStartX;
    if (dx < -DEAD_ZONE)     { player.vx = -PLAYER_SPEED; player.facing = -1; }
    else if (dx > DEAD_ZONE) { player.vx =  PLAYER_SPEED; player.facing =  1; }
    else player.vx *= 0.75;
  } else {
    if (keys.left)  { player.vx = -PLAYER_SPEED; player.facing = -1; }
    if (keys.right) { player.vx =  PLAYER_SPEED; player.facing =  1; }
    if (!keys.left && !keys.right) player.vx *= 0.75;
  }

  player.vy += GRAVITY * dt;
  player.x += player.vx * dt;

  // Запоминаем нижнюю границу ДО вертикального движения
  const prevBottom = player.y + player.h;
  player.y += player.vy * dt;

  // Wrap по горизонтали
  if (player.x + player.w < 0) player.x = W;
  if (player.x > W) player.x = -player.w;

  // Трейл
  player.trail.push({ x: player.x + player.w/2, y: player.y + player.h, life: 1 });
  if (player.trail.length > 8) player.trail.shift();
  player.trail.forEach(t => { t.life -= 0.12 * dt; });

  // Коллизии с платформами — используем мировые координаты (не экранные)
  player.onGround = false;
  if (player.vy > 0) {
    const currBottom = player.y + player.h;
    for (const p of platforms) {
      const platTop = p.y; // мировая Y платформы (не - cameraY!)
      // Горизонтальное перекрытие
      const overlapX = player.x + player.w > p.x + 4 && player.x < p.x + p.w - 4;
      // Swept: нижняя граница пересекла верх платформы за этот кадр
      const crossed = prevBottom <= platTop + 2 && currBottom >= platTop;
      if (overlapX && crossed) {
        if (p.type === 'crumble') p.crumbling = true;
        if (!p.crumbling || p.crumbleTimer < 0.4) {
          const jumpMult = (p.type === 'bounce') ? 1.5 : 1.0;
          player.vy = JUMP_FORCE * jumpMult;
          player.y = platTop - player.h; // точно на платформу
          player.onGround = true;
          if (p.type === 'bounce') spawnParticles(player.x + player.w/2, platTop - cameraY, '#00FFCC', 8);
          break;
        }
      }
    }
  }

  // Crumble таймер
  platforms.forEach(p => {
    if (p.crumbling) p.crumbleTimer += 0.04 * dt;
  });
  platforms = platforms.filter(p => p.crumbleTimer < 1);

  // Камера — следим чтобы игрок был в верхней трети
  const targetCamY = player.y - H * 0.35;
  if (targetCamY < cameraY) {
    cameraY = targetCamY;
  }

  // Высота → очки
  const playerWorldY = cameraY + player.y;
  if (playerWorldY < highestY) {
    const diff = highestY - playerWorldY;
    score += Math.floor(diff * 0.1);
    highestY = playerWorldY;
    floor = Math.floor(-highestY / PLATFORM_GAP) + 1;
    updateHUD();
  }

  // Генерим новые платформы выше
  const topPlatY = platforms.reduce((mn, p) => Math.min(mn, p.y), Infinity);
  if (topPlatY - cameraY > -H * 2) {
    // Находим самую верхнюю платформу как опорную
    let lastPlat = platforms.reduce((mn, p) => p.y < mn.y ? p : mn, platforms[0]);
    let py = topPlatY;
    for (let i = 0; i < 5; i++) {
      py -= PLATFORM_GAP + Math.random() * 20;
      lastPlat = spawnPlatform(py, lastPlat);
    }
  }
  // Удаляем старые платформы снизу (но не землю)
  platforms = platforms.filter(p => p.type === 'ground' || p.y - cameraY < H + 200);

  // Звёзды
  stars.forEach(s => {
    if (s.collected) return;
    s.angle += 0.05 * dt;
    const sx = s.x, sy = s.y; // мировые координаты
    const px = player.x + player.w/2, py = player.y + player.h/2;
    const dx = px - sx, dy = py - sy;
    if (Math.sqrt(dx*dx + dy*dy) < s.r + 20) {
      s.collected = true;
      score += s.value;
      spawnParticles(sx - 0, sy - cameraY, '#FFD700', 12);
      updateHUD();
    }
  });
  stars = stars.filter(s => !s.collected && s.y - cameraY < H + 100);
  while (stars.length < 6) spawnStar();

  // Частицы
  particles.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 0.15 * dt;
    p.life -= 0.04 * dt;
    p.r *= 0.95;
  });
  particles = particles.filter(p => p.life > 0);

  // Смерть — упал ниже экрана
  if (player.y - cameraY > H + 100) {
    lives--;
    updateHUD();
    if (lives <= 0) {
      triggerGameOver();
      return;
    }
    // Возрождение на ближайшей сверху платформе
    const visiblePlats = platforms.filter(p => p.type !== 'ground' && p.y < player.y);
    const nearest = visiblePlats.length > 0
      ? visiblePlats.reduce((mx, p) => p.y > mx.y ? p : mx, visiblePlats[0])
      : platforms.find(p => p.type === 'ground') || platforms[0];
    player.y = nearest.y - player.h - 10;
    player.x = nearest.x + nearest.w / 2 - player.w / 2;
    player.vy = JUMP_FORCE;
    cameraY = player.y - H * 0.5;
  }

  // Анимация персонажа
  player.frameTimer += dt;
  if (player.frameTimer > 8) { player.frame = (player.frame + 1) % 2; player.frameTimer = 0; }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
      r: 3 + Math.random() * 4, color, life: 1,
    });
  }
}

// ══════════════════════════════════════════════════════
// DRAW
// ══════════════════════════════════════════════════════

// Статичные данные для фона (генерируются один раз)
const bgStars = Array.from({length: 120}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.5 + 0.3,
  bright: Math.random(),
  twinkle: Math.random() * Math.PI * 2,
}));

const bgMountainsFar = generateMountainLine(12, 0.55, 0.85);
const bgMountainsNear = generateMountainLine(8, 0.72, 1.0);

function generateMountainLine(peaks, minH, maxH) {
  const pts = [];
  for (let i = 0; i <= peaks; i++) {
    pts.push({
      x: i / peaks,
      y: minH + Math.random() * (maxH - minH),
    });
  }
  return pts;
}

const cloudData = Array.from({length: 14}, () => ({
  x: Math.random(),
  y: 0.05 + Math.random() * 0.55,
  w: 0.08 + Math.random() * 0.14,
  speed: 0.00008 + Math.random() * 0.00012,
  alpha: 0.25 + Math.random() * 0.35,
  layer: Math.random() < 0.5 ? 0 : 1, // 0=дальние, 1=ближние
}));

function draw() {
  const skyProgress = Math.min(Math.max(-cameraY / 4000, 0), 1);

  // ── Небо ──
  const skyColors = [
    // [низ] ночь → день → высь
    lerpColor('#1a0838', '#0d2a6e', skyProgress),
    lerpColor('#0d1540', '#0a1a55', skyProgress),
    lerpColor('#060c28', '#050e38', skyProgress),
  ];
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, skyColors[2]);
  grad.addColorStop(0.5, skyColors[1]);
  grad.addColorStop(1, skyColors[0]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // ── Звёзды (параллакс 0) ──
  const starAlpha = Math.max(0, 1 - skyProgress * 1.5);
  if (starAlpha > 0.01) {
    const camOffY = (cameraY * 0.05) % H;
    bgStars.forEach(s => {
      const tw = Math.sin(Date.now() * 0.001 * (0.5 + s.twinkle) + s.twinkle) * 0.4 + 0.6;
      ctx.save();
      ctx.globalAlpha = starAlpha * tw * (0.4 + s.bright * 0.6);
      ctx.fillStyle = s.bright > 0.8 ? '#fffbe8' : '#aac4ff';
      ctx.beginPath();
      ctx.arc(s.x * W, (s.y * H * 3 + camOffY) % H, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  // ── Луна ──
  {
    const moonX = W * 0.82;
    const moonY = H * 0.12 - cameraY * 0.02;
    const moonR = Math.min(W, H) * 0.055;
    ctx.save();
    // Свечение
    const moonGlow = ctx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 2.5);
    moonGlow.addColorStop(0, `rgba(220,235,255,${0.18 - skyProgress * 0.15})`);
    moonGlow.addColorStop(1, 'rgba(220,235,255,0)');
    ctx.fillStyle = moonGlow;
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR * 2.5, 0, Math.PI * 2); ctx.fill();
    // Диск
    ctx.fillStyle = '#ddeeff';
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2); ctx.fill();
    // Кратеры
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#8899bb';
    [[0.3, -0.2, 0.28], [-0.25, 0.35, 0.18], [0.1, 0.5, 0.12]].forEach(([dx, dy, dr]) => {
      ctx.beginPath(); ctx.arc(moonX + dx * moonR, moonY + dy * moonR, dr * moonR, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  // ── Дальние горы (параллакс 0.08) ──
  {
    const offY = cameraY * 0.08;
    ctx.save();
    ctx.globalAlpha = 0.55 + skyProgress * 0.2;
    const mGrad = ctx.createLinearGradient(0, H * 0.4, 0, H);
    mGrad.addColorStop(0, lerpColor('#1a1050', '#1a3060', skyProgress));
    mGrad.addColorStop(1, lerpColor('#0d0a30', '#0d1e50', skyProgress));
    ctx.fillStyle = mGrad;
    ctx.beginPath();
    ctx.moveTo(0, H);
    bgMountainsFar.forEach((pt, i) => {
      const x = pt.x * W;
      const y = pt.y * H + offY;
      i === 0 ? ctx.lineTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // Снежные шапки
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#c8d8f8';
    bgMountainsFar.forEach((pt, i) => {
      if (i === 0 || i === bgMountainsFar.length - 1) return;
      const prev = bgMountainsFar[i - 1], next = bgMountainsFar[i + 1];
      if (pt.y < prev.y && pt.y < next.y) {
        const x = pt.x * W, y = pt.y * H + offY;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 18, y + 22);
        ctx.lineTo(x + 18, y + 22);
        ctx.closePath(); ctx.fill();
      }
    });
    ctx.restore();
  }

  // ── Ближние горы (параллакс 0.18) ──
  {
    const offY = cameraY * 0.18;
    ctx.save();
    ctx.globalAlpha = 0.85;
    const mGrad = ctx.createLinearGradient(0, H * 0.5, 0, H);
    mGrad.addColorStop(0, lerpColor('#0d0820', '#0d1a3a', skyProgress));
    mGrad.addColorStop(1, lerpColor('#08060f', '#080f22', skyProgress));
    ctx.fillStyle = mGrad;
    ctx.beginPath();
    ctx.moveTo(0, H);
    bgMountainsNear.forEach((pt) => {
      ctx.lineTo(pt.x * W, pt.y * H + offY);
    });
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // Снег
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#e8f0ff';
    bgMountainsNear.forEach((pt, i) => {
      if (i === 0 || i === bgMountainsNear.length - 1) return;
      const prev = bgMountainsNear[i - 1], next = bgMountainsNear[i + 1];
      if (pt.y < prev.y && pt.y < next.y) {
        const x = pt.x * W, y = pt.y * H + offY;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 24, y + 30);
        ctx.lineTo(x + 24, y + 30);
        ctx.closePath(); ctx.fill();
      }
    });
    ctx.restore();
  }

  // ── Облака (два слоя) ──
  cloudData.forEach(c => {
    const parallax = c.layer === 0 ? 0.1 : 0.25;
    c.x += c.speed;
    if (c.x > 1.2) c.x = -0.2;
    const cx = c.x * W;
    const cy = c.y * H - cameraY * parallax;
    const cw = c.w * W;
    ctx.save();
    ctx.globalAlpha = c.alpha * (c.layer === 0 ? 0.6 : 0.9);
    // Объёмное облако из нескольких кругов
    const puffs = c.layer === 0
      ? [[-0.4, 0, 0.55], [0, -0.35, 0.75], [0.4, 0, 0.55], [0, 0.1, 0.65]]
      : [[-0.45, 0.05, 0.5], [0, -0.4, 0.8], [0.45, 0.05, 0.5], [-0.2, 0.15, 0.6], [0.2, 0.15, 0.6]];
    const cloudGrad = ctx.createRadialGradient(cx, cy - cw * 0.1, 0, cx, cy, cw * 0.9);
    cloudGrad.addColorStop(0, c.layer === 0 ? 'rgba(180,200,240,0.9)' : 'rgba(220,230,255,0.95)');
    cloudGrad.addColorStop(1, 'rgba(140,170,220,0)');
    ctx.fillStyle = cloudGrad;
    puffs.forEach(([dx, dy, dr]) => {
      ctx.beginPath();
      ctx.arc(cx + dx * cw, cy + dy * cw * 0.5, dr * cw * 0.5, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  });

  if (gameState !== 'start') {
    // ── Земля (если видна) ──
    const groundY = H - 40 - cameraY;
    if (groundY < H + 20) {
      ctx.save();
      const gGrad = ctx.createLinearGradient(0, groundY, 0, groundY + 40);
      gGrad.addColorStop(0, '#2d5a27');
      gGrad.addColorStop(0.3, '#1e3d1a');
      gGrad.addColorStop(1, '#0f1f0d');
      ctx.fillStyle = gGrad;
      ctx.fillRect(0, groundY, W, 40);
      // Трава поверху
      ctx.fillStyle = '#4a8f3f';
      ctx.fillRect(0, groundY, W, 6);
      ctx.fillStyle = '#5da852';
      for (let gx = 0; gx < W; gx += 8) {
        const gh = 4 + Math.sin(gx * 0.3) * 2;
        ctx.fillRect(gx, groundY - gh + 6, 3, gh);
      }
      ctx.restore();
    }

    // Трейл игрока
    player.trail.forEach((t) => {
      const a = t.life * 0.3;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#A78BFA';
      ctx.beginPath();
      ctx.ellipse(t.x, t.y - cameraY, Math.max(0.1, 6 * t.life), Math.max(0.1, 4 * t.life), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Платформы
    platforms.forEach(p => drawPlatform(p));

    // Звёзды
    stars.forEach(s => {
      if (!s.collected) drawStar(s.x, s.y - cameraY, s.r, s.angle);
    });

    // Частицы
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Игрок
    drawPlayer();
  }
}


function drawPlatform(p) {
  // Земля рисуется отдельно в draw()
  if (p.type === 'ground') return;
  const px = p.x, py = p.y - cameraY, pw = p.w, ph = 14;
  const alpha = p.crumbling ? Math.max(0, 1 - p.crumbleTimer) : 1;
  ctx.save();
  ctx.globalAlpha = alpha;

  if (p.type === 'bounce') {
    // Зелёная пружинящая
    ctx.fillStyle = '#00E676';
    drawRoundRect(px, py, pw, ph, 7);
    ctx.fill();
    if (pw > 10) {
      ctx.fillStyle = '#69F0AE';
      drawRoundRect(px + 4, py, pw - 8, 5, 4);
      ctx.fill();
    }
    // Пружина
    ctx.strokeStyle = '#00C853';
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(px + pw * 0.35, py + ph + i*5);
      ctx.lineTo(px + pw * 0.65, py + ph + i*5);
      ctx.stroke();
    }
  } else if (p.type === 'crumble') {
    // Красная рассыпающаяся
    ctx.fillStyle = '#FF5252';
    drawRoundRect(px, py, pw, ph, 7);
    ctx.fill();
    if (pw > 10) {
      ctx.fillStyle = '#FF8A80';
      drawRoundRect(px + 4, py, pw - 8, 5, 4);
      ctx.fill();
    }
    if (p.crumbling) {
      // Трещины
      ctx.strokeStyle = '#B71C1C';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(px + pw*0.3, py); ctx.lineTo(px + pw*0.5, py + ph);
      ctx.moveTo(px + pw*0.6, py); ctx.lineTo(px + pw*0.4, py + ph);
      ctx.stroke();
    }
  } else {
    // Обычная
    const shade = Math.sin(p.y * 0.01) * 20;
    ctx.fillStyle = `hsl(${220 + shade}, 60%, 55%)`;
    drawRoundRect(px, py, pw, ph, 7);
    ctx.fill();
    if (pw > 10) {
      ctx.fillStyle = `hsl(${220 + shade}, 60%, 70%)`;
      drawRoundRect(px + 4, py, pw - 8, 5, 4);
      ctx.fill();
    }
    if (pw > 6) {
      // Трава
      ctx.fillStyle = '#66BB6A';
      drawRoundRect(px + 2, py, pw - 4, 5, 4);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawRoundRect(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  if (r < 0) r = 0;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawPlayer() {
  const px = player.x;
  const py = player.y - cameraY;
  const facing = player.facing;
  const frame = player.frame;

  ctx.save();
  ctx.translate(px + player.w/2, py + player.h/2);
  if (facing < 0) ctx.scale(-1, 1);

  // Тело
  const bodyGrad = ctx.createLinearGradient(-18, -20, 18, 20);
  bodyGrad.addColorStop(0, '#A78BFA');
  bodyGrad.addColorStop(1, '#7C3AED');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 4, 18, 22, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ботинки
  ctx.fillStyle = '#4CAF50';
  const legOff = frame === 0 ? 4 : -2;
  ctx.beginPath(); ctx.ellipse(-8, 20 + legOff, 7, 6, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8, 20 - legOff, 7, 6, 0.3, 0, Math.PI * 2); ctx.fill();

  // Глаза
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(6, -6, 8, 9, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a0a3e';
  ctx.beginPath(); ctx.ellipse(8, -5, 4, 5, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; // блик
  ctx.beginPath(); ctx.arc(10, -8, 1.5, 0, Math.PI*2); ctx.fill();

  // Шапка
  ctx.fillStyle = '#FF6B35';
  ctx.beginPath();
  ctx.moveTo(-14, -14); ctx.lineTo(14, -14);
  ctx.lineTo(10, -28); ctx.lineTo(-10, -28);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FF8C5A';
  ctx.fillRect(-14, -16, 28, 5);

  // Руки
  ctx.strokeStyle = '#A78BFA'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const armAngle = frame === 0 ? -0.4 : 0.4;
  ctx.save();
  ctx.rotate(armAngle);
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-30, 8); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.rotate(-armAngle);
  ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(30, 8); ctx.stroke();
  ctx.restore();

  ctx.restore();
}

function drawStar(x, y, r, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const spikes = 5;
  const outerR = r;
  const innerR = r * 0.45;
  ctx.beginPath();
  for (let i = 0; i < spikes * 2; i++) {
    const a = (i * Math.PI) / spikes;
    const radius = i % 2 === 0 ? outerR : innerR;
    if (i === 0) ctx.moveTo(Math.cos(a) * radius, Math.sin(a) * radius);
    else ctx.lineTo(Math.cos(a) * radius, Math.sin(a) * radius);
  }
  ctx.closePath();
  // Glow
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#FFD700';
  ctx.fill();
  ctx.strokeStyle = '#FFF';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 0xFF, ag = (ah >> 8) & 0xFF, ab = ah & 0xFF;
  const br = (bh >> 16) & 0xFF, bg = (bh >> 8) & 0xFF, bb = bh & 0xFF;
  const rr = Math.round(ar + (br - ar) * t);
  const rg = Math.round(ag + (bg - ag) * t);
  const rb = Math.round(ab + (bb - ab) * t);
  return `rgb(${rr},${rg},${rb})`;
}

// HUD / SCREENS
// ══════════════════════════════════════════════════════
function updateHUD() {
  document.getElementById('hud-score').textContent = score;
  document.getElementById('hud-floor').textContent = floor;
  const livesEl = document.getElementById('hud-lives');
  livesEl.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const span = document.createElement('span');
    span.className = 'life';
    span.textContent = i < lives ? '❤️' : '🖤';
    livesEl.appendChild(span);
  }
}

function showHUD(v) {
  document.getElementById('hud').classList.toggle('visible', v);
  document.getElementById('ctrl-zone').style.display  = v ? 'block' : 'none';
  document.getElementById('hint-left').style.opacity  = v ? '0.18' : '0';
  document.getElementById('hint-right').style.opacity = v ? '0.18' : '0';
}

function triggerGameOver() {
  gameState = 'gameover';
  showHUD(false);
  const isNew = score > bestScore;
  if (isNew) {
    bestScore = score;
    localStorage.setItem(`summit_best_${userId}`, bestScore);
    document.getElementById('best-display').textContent = bestScore;
  }
  document.getElementById('go-score').textContent = score;
  document.getElementById('go-floor').textContent = floor;
  document.getElementById('go-best').textContent = bestScore;
  document.getElementById('go-new-record').style.display = isNew ? 'block' : 'none';
  document.getElementById('screen-gameover').classList.add('visible');

  // Отправляем результат боту
  if (tg) {
    tg.sendData(JSON.stringify({ action: 'game_over', score, floor, best: bestScore }));
  }
}

// Клавиатура
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keys.left  = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft'  || e.code === 'KeyA') keys.left  = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

// ── Джойстик: палец скользит по нижней зоне, герой тянется к нему ──
const ctrlZone  = document.getElementById('ctrl-zone');
const joyBase   = document.getElementById('joystick-base');
const joyKnob   = document.getElementById('joystick-knob');

let joystickActive = false;
let joystickStartX = 0;   // X где приложили палец
let joystickCurX   = 0;   // текущий X пальца
const DEAD_ZONE    = 12;  // пиксели, до которых движения нет
const MAX_KNOB     = 40;  // max смещение кружочка от центра

function joystickShow(x, y) {
  joyBase.style.left = x + 'px';
  joyBase.style.top  = y + 'px';
  joyBase.style.display = 'block';
  joyKnob.style.display = 'block';
  joystickMoveKnob(x, y);
}
function joystickMoveKnob(bx, cx) {
  const dx = Math.max(-MAX_KNOB, Math.min(MAX_KNOB, cx - joystickStartX));
  joyKnob.style.left = (joystickStartX + dx) + 'px';
  joyKnob.style.top  = joyBase.style.top;
}
function joystickHide() {
  joyBase.style.display = 'none';
  joyKnob.style.display = 'none';
  keys.left = false;
  keys.right = false;
  joystickActive = false;
}

ctrlZone.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState !== 'playing') return;
  const t = e.changedTouches[0];
  joystickActive = true;
  joystickStartX = t.clientX;
  joystickCurX   = t.clientX;
  joystickShow(t.clientX, t.clientY);
}, { passive: false });

ctrlZone.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joystickActive) return;
  const t = e.changedTouches[0];
  joystickCurX = t.clientX;
  const dx = joystickCurX - joystickStartX;
  // Обновляем визуал кружочка
  const clampDx = Math.max(-MAX_KNOB, Math.min(MAX_KNOB, dx));
  joyKnob.style.left = (joystickStartX + clampDx) + 'px';
  // Обновляем клавиши
  if (dx < -DEAD_ZONE)       { keys.left = true;  keys.right = false; }
  else if (dx > DEAD_ZONE)   { keys.right = true;  keys.left = false; }
  else                        { keys.left = false; keys.right = false; }
}, { passive: false });

ctrlZone.addEventListener('touchend',    e => { e.preventDefault(); joystickHide(); }, { passive: false });
ctrlZone.addEventListener('touchcancel', e => { e.preventDefault(); joystickHide(); }, { passive: false });

// Наклон устройства (gyro)
window.addEventListener('deviceorientation', e => {
  if (gameState !== 'playing') return;
  if (joystickActive) return; // джойстик имеет приоритет
  const tilt = e.gamma; // -90..90
  if (tilt < -8) { keys.left = true; keys.right = false; }
  else if (tilt > 8) { keys.right = true; keys.left = false; }
  else { keys.left = false; keys.right = false; }
});

// ══════════════════════════════════════════════════════
// КНОПКИ
// ══════════════════════════════════════════════════════
document.getElementById('btn-play').addEventListener('click', () => {
  document.getElementById('screen-start').style.display = 'none';
  gameState = 'playing';
  initGame();
});

document.getElementById('btn-restart').addEventListener('click', () => {
  document.getElementById('screen-gameover').classList.remove('visible');
  gameState = 'playing';
  initGame();
});

document.getElementById('btn-menu').addEventListener('click', () => {
  document.getElementById('screen-gameover').classList.remove('visible');
  gameState = 'start';
  showHUD(false);
  document.getElementById('screen-start').style.display = 'flex';
});

// ══════════════════════════════════════════════════════
// СТАРТ
// ══════════════════════════════════════════════════════
requestAnimationFrame(loop);
</script>
</body>
</html>
